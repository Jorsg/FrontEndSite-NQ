events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Optimizaciones
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Charset
        charset utf-8;

        # Página principal (español)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Versión en inglés
        location /en/ {
            alias /usr/share/nginx/html/en/;
            try_files $uri $uri/ /en/index.html;
        }

        # Versión en francés
        location /fr/ {
            alias /usr/share/nginx/html/fr/;
            try_files $uri $uri/ /fr/index.html;
        }

        # Cache para imágenes y fuentes (cambian raramente)
        location ~* \.(jpg|jpeg|png|gif|ico|woff|woff2|ttf|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Cache para CSS y JS (pueden cambiar en cada deploy)
        location ~* \.(css|js)$ {
            expires 7d;
            add_header Cache-Control "public, must-revalidate";
        }

        # Página de error 404
        error_page 404 /index.html;

        # Seguridad básica
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
